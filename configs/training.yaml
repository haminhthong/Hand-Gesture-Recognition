# Cấu hình huấn luyện cho Calibrated RBF-SVM Static Gesture Recognizer
dataset_path: "data/raw/landmarks_dataset.csv"
manifest_path: "data/processed/manifest.json"
splits_path: "data/processed/splits.json"
model_output_path: "models/static_gesture_svm_v1.joblib"

mirror_left_hand: true
normalize_rotation: true

labels:
  - "Fist"
  - "Select"
  - "Options"
  - "Stop"
  - "Peace"
  - "NoAction"

cv_splits: 5
c_candidates:
  - 0.1
  - 1.0
  - 10.0
  - 50.0
gamma_candidates:
  - "scale"
  - "0.01"
  - "0.1"

target_precision_actionable: 0.90
max_false_action_rate: 0.05
