# Cấu hình huấn luyện cho Static Gesture SVM Classifier
dataset_path: "data/raw/landmarks_dataset.csv"
splits_path: "data/processed/splits.json"
model_output_path: "models/static_gesture_svm.joblib"

mirror_left_hand: true
normalize_rotation: true

labels:
  - "Fist"
  - "Select"
  - "Options"
  - "Stop"
  - "Peace"
  - "NoAction"

cv_splits: 5
c_candidates:
  - 0.1
  - 1.0
  - 10.0
  - 50.0
gamma_candidates:
  - "scale"
  - "0.01"
  - "0.1"

confidence_threshold: 0.65
