# Cấu hình thực thi Runtime cho Hand Gesture Controller
mode: "svm"
camera_index: 0
target_width: 640
target_height: 480
mirror_camera: true

min_detection_confidence: 0.7
min_tracking_confidence: 0.6
max_num_hands: 1

model_path: "models/static_gesture_svm.joblib"
confidence_threshold: 0.65

activation_dwell_ms: 120.0
release_dwell_ms: 100.0
history_horizon_ms: 250.0
hand_loss_timeout_ms: 150.0

on_off_timeout_seconds: 1.5
cursor_tau: 0.08

cooldowns:
  change_color: 0.5
  delete_object: 0.5
  toggle_canvas: 0.8
  open_menu: 0.5

show_debug_hud: true
