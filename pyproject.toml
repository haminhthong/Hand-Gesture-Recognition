[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-gesture-controller"
version = "1.0.0"
description = "Real-time Spatial Hand Gesture Controller desktop application using OpenCV and MediaPipe Hands."
readme = "README.md"
authors = [
    { name = "Computer Vision / HCI Developer" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0"
]

[project.scripts]
hand-controller = "hand_gesture_controller.app:main"
hand-collect = "hand_gesture_controller.data_collection:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["Image", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
