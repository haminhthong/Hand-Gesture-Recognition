name: Automated CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Compile python source files
        run: python -m compileall -q src/ scripts/ tools/ tests/

      - name: Run Ruff Linter
        run: python -m ruff check .

      - name: Run Mypy Type Checker
        run: python -m mypy src/ --python-version ${{ matrix.python-version }}

      - name: Run Pytest Suite with Coverage
        run: python -m pytest --cov=src/hand_gesture_controller tests/
